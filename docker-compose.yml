networks:
  transmar-net:
    driver: bridge

services:
  postgres_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transmar
      POSTGRES_PASSWORD: transmar123
      POSTGRES_DB: TransmarDb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transmar -d TransmarDb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - transmar-net

  backend:
    build:
      context: ./backend_transmar
      args:
        DATABASE_URL: postgresql://transmar:transmar123@postgres_db:5432/TransmarDb?schema=public
    command: sh -c "npx prisma migrate deploy && node dist/src/main.js"
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://transmar:transmar123@postgres_db:5432/TransmarDb?schema=public
      - JWT_SECRET=transmar-local-dev-jwt-secret-2026-not-for-production
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - transmar-net

  frontend:
    build:
      context: ./frontend_transmar
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - transmar-net